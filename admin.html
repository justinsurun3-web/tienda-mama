<!DOCTYPE html>
<html lang="es">

<head>

<title>Panel de Administración | Tienda de Mamá</title>

<link rel="stylesheet" href="style.css">

<script>

if (acceso !== contraseña) {
    alert("Acceso denegado.");

</header>

<button onclick="crearProducto()">
Guardar producto
</button>

<section class="luxury-products">

</div>
